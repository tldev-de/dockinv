{%  extends 'base.html.j2' %}

{% block page %}
    Hosts
{% endblock %}

{% block filter_table %}hostTable{% endblock %}
{% block filter_cols %}0{% endblock %}

{% block body %}
<div class="flex flex-row-reverse mb-4 gap-2">
    <a href="/hosts/add" class="btn btn-sm btn-primary">Add Host</a>
    <button class="btn btn-sm btn-secondary"
            hx-post="/hosts/collect" hx-target="#hostTable" hx-swap="outerHTML"
            hx-headers='{"X-CSRFToken": "{{ csrf_token() }}"}'
            hx-disabled-elt="this">
        Collect now
        <span class="loading loading-spinner loading-xs htmx-indicator"></span>
    </button>
</div>
{% include 'hosts/_hosts_table.html' %}
{% endblock %}
