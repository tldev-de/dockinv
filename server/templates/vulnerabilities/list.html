{% extends 'base.html.j2' %}

{% block page %}Vulnerabilities{% endblock %}

{% block body %}
<form class="flex flex-wrap gap-3 mb-4 items-end"
      hx-get="/vulnerabilities/table" hx-target="#vulnTable" hx-swap="outerHTML"
      hx-trigger="change, keyup changed delay:400ms">
    <div>
        <label class="label" for="cve">CVE</label>
        <input id="cve" name="cve" value="{{ cve }}" placeholder="CVE-…"
               class="input input-bordered input-sm">
    </div>
    <div>
        <label class="label" for="severity">Min. Severity</label>
        <select id="severity" name="severity" class="select select-bordered select-sm">
            <option value="">All</option>
            <option value="CRITICAL" {% if severity == 'CRITICAL' %}selected{% endif %}>Critical</option>
            <option value="HIGH" {% if severity == 'HIGH' %}selected{% endif %}>High</option>
            <option value="MEDIUM" {% if severity == 'MEDIUM' %}selected{% endif %}>Medium</option>
            <option value="LOW" {% if severity == 'LOW' %}selected{% endif %}>Low</option>
        </select>
    </div>
    <div>
        <label class="label" for="min_cvss">Min. CVSS</label>
        <input id="min_cvss" name="min_cvss" value="{{ min_cvss }}" type="number" step="0.1" min="0" max="10"
               class="input input-bordered input-sm w-24">
    </div>
    <div>
        <label class="label cursor-pointer gap-2" for="fixable">
            <span>Only fixable</span>
            <input id="fixable" name="fixable" type="checkbox" value="1" {% if fixable %}checked{% endif %}
                   class="checkbox checkbox-sm">
        </label>
    </div>
</form>

<div class="overflow-x-auto">
{% include 'vulnerabilities/_table.html' %}
</div>
{% endblock %}
