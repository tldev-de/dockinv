{%  extends 'base.html.j2' %}

{% block page %}
    Images
{% endblock %}

{% block filter_table %}imagesTable{% endblock %}
{% block filter_cols %}0{% endblock %}

{% block body %}
<div class="flex flex-row-reverse mb-4">
    <button class="btn btn-sm btn-secondary"
            hx-post="/images/scan" hx-target="#imagesTable" hx-swap="outerHTML"
            hx-headers='{"X-CSRFToken": "{{ csrf_token() }}"}'
            hx-disabled-elt="this">
        Scan now
        <span class="loading loading-spinner loading-xs htmx-indicator"></span>
    </button>
</div>
{% include 'images/_images_table.html' %}
{% endblock %}
