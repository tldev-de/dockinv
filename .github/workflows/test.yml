name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r server/requirements-dev.txt

      - name: Run tests
        working-directory: server
        env:
          PYTHONPATH: .
        run: pytest --cov=. --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: server/coverage.xml

  agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r agent/requirements-dev.txt

      - name: Run tests
        working-directory: agent
        env:
          PYTHONPATH: .
        run: pytest -q

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r server/requirements-e2e.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run browser E2E tests
        working-directory: server
        env:
          PYTHONPATH: .
        run: pytest e2e -q
