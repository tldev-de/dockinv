name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: "pip install --require-hashes --only-binary=:all: -r server/requirements-dev.txt"

      - name: Run tests
        working-directory: server
        env:
          PYTHONPATH: .
        run: pytest --cov=. --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-coverage
          path: server/coverage.xml

  agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: "pip install --require-hashes --only-binary=:all: -r agent/requirements-dev.txt"

      - name: Run tests
        working-directory: agent
        env:
          PYTHONPATH: .
        run: pytest -q

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: "pip install --require-hashes --only-binary=:all: -r server/requirements-e2e.txt"

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run browser E2E tests
        working-directory: server
        env:
          PYTHONPATH: .
        run: pytest e2e -q
