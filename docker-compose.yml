services:
  agent:
    image: tldevde/dockinv-agent:latest
    restart: always
    ports:
      - "9999:9999"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      HTTP_TOKEN: your_secret

  server:
    image: tldevde/dockinv-server:latest
    restart: always
    ports:
     - "8000:8000"
    depends_on:
      - redis
    environment:
      - DATABASE_AUTO_UPGRADE=1
      - SECRET_KEY=change_me_to_a_random_secret
      - CELERY_BROKER_URL=redis://redis:6379/0   # lets the "Collect now" button enqueue tasks
      # Optional: enable OIDC login for the web UI. Set all three to activate.
      # Without them the UI runs WITHOUT authentication (warned at startup).
      # - OIDC_DISCOVERY_URL=https://idp.example/.well-known/openid-configuration
      # - OIDC_CLIENT_ID=change_me
      # - OIDC_CLIENT_SECRET=change_me
      # - OIDC_SCOPE=openid email profile          # optional, this is the default
      # - OIDC_REDIRECT_URI=https://dockinv.example/auth/callback  # optional, override if behind a proxy
    volumes:
        - data:/data

  worker:
    image: tldevde/dockinv-server:latest
    command: celery -A tasks worker -l info -B -s /data/celerybeat-schedule
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "celery -A tasks inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - redis
    volumes:
        - data:/data
        - /var/run/docker.sock:/var/run/docker.sock:ro
        # Private registries: mount a Docker config.json with credentials so Trivy & Xeol
        # can pull private images (both scanners read it). Create it with
        # `docker login <registry>` (writes ~/.docker/config.json). See the
        # "Private registries" section in the Readme.
        # - ~/.docker/config.json:/home/dockinv/.docker/config.json:ro
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=change_me_to_a_random_secret

  redis:
    image: redis:7-alpine
    restart: always


volumes:
  data: